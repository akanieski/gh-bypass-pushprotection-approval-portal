# Optional development backend. The portal and worker still run together in one app container.
services:
  portal:
    environment:
      Portal__S3Endpoint: http://minio:9000
      Portal__S3AllowHttpForDevelopment: "true"
      Portal__S3ForcePathStyle: "true"
  minio:
    image: quay.io/minio/minio:latest
    command: server /data --console-address ":9001"
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    environment:
      MINIO_ROOT_USER_FILE: /run/secrets/minio-root-user
      MINIO_ROOT_PASSWORD_FILE: /run/secrets/minio-root-password
    secrets:
      - minio-root-user
      - minio-root-password
    volumes:
      - minio-data:/data
secrets:
  minio-root-user:
    file: ./secrets/minio-root-user
  minio-root-password:
    file: ./secrets/minio-root-password
volumes:
  minio-data:
